name: Load test

# Click this to reproduce the numbers: boots the stack, seeds 10k/2k, and uploads the k6 report.
on:
  workflow_dispatch:
    inputs:
      duration:
        description: How long the scenario runs
        default: 3m

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p docs/reports && chmod 777 docs/reports
      - run: docker compose up -d --build --wait caddy api-a api-b
      - run: docker compose --profile load run --rm -e DURATION=${{ inputs.duration }} k6 run /load/board.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-report
          path: docs/reports/load-report.html
